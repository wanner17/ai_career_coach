# See root Dockerfile / README "내부 서버 배포" for how this is used.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # career-backend, reverse-proxied under the same origin as the SPA —
    # the browser never sees a different host/port, so there's no CORS
    # preflight to configure on this path at all.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 상담 SSE(/api/career/ai/chat/stream)용 — 기본값(on)이면 nginx가 백엔드
        # 응답을 다 모았다가 한 번에 클라이언트로 넘겨서, 서버는 실제로 토큰 단위로
        # 스트리밍해도 브라우저는 한꺼번에 받는 것처럼 보인다(체감상 "타이핑 안 됨").
        # 일반 JSON 응답엔 영향 없음 — 버퍼링 꺼도 그냥 바로바로 흘려보낼 뿐 동작은 같다.
        proxy_buffering off;
        proxy_cache off;
        # 긴 스트리밍 턴(툴콜링 + 답변 생성) 동안 nginx가 먼저 끊지 않도록 —
        # AiChatService의 SseEmitter 타임아웃(120s)보다 여유 있게.
        proxy_read_timeout 180s;
    }

    # SPA fallback — /quest, /mypage, /admin/quest 같은 하위 경로를 새로고침해도
    # 404 대신 index.html을 돌려줘야 React 라우터가 그 경로를 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
