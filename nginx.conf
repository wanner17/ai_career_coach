# See root Dockerfile / README "내부 서버 배포" for how this is used.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # career-backend, reverse-proxied under the same origin as the SPA —
    # the browser never sees a different host/port, so there's no CORS
    # preflight to configure on this path at all.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 상담 SSE(/api/career/ai/chat/stream)용 — 기본값(on)이면 nginx가 백엔드
        # 응답을 다 모았다가 한 번에 클라이언트로 넘겨서, 서버는 실제로 토큰 단위로
        # 스트리밍해도 브라우저는 한꺼번에 받는 것처럼 보인다(체감상 "타이핑 안 됨").
        # 일반 JSON 응답엔 영향 없음 — 버퍼링 꺼도 그냥 바로바로 흘려보낼 뿐 동작은 같다.
        proxy_buffering off;
        proxy_cache off;
        # 긴 스트리밍 턴(툴콜링 + 답변 생성) 동안 nginx가 먼저 끊지 않도록 —
        # AiChatService의 SseEmitter 타임아웃(120s)보다 여유 있게.
        proxy_read_timeout 180s;
    }

    # Vite가 파일명에 콘텐츠 해시를 박아서 내보내는 빌드 산출물(index-xxxx.js 등) —
    # 내용이 바뀌면 파일명 자체가 달라지므로 영구 캐시해도 안전하다. 새 배포 후에도
    # 학생들 브라우저가 옛 파일을 계속 쓰는 일이 없다(아래 index.html의 no-cache와
    # 짝을 이룸 — index.html이 항상 최신 해시로 다시 받아지기 때문).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — /quest, /mypage, /admin/quest 같은 하위 경로를 새로고침해도
    # 404 대신 index.html을 돌려줘야 React 라우터가 그 경로를 처리한다.
    #
    # index.html(과 career-embed.js/host-demo.html 등 해시 없는 정적 파일)은 파일명이
    # 안 바뀌므로, 캐시 정책을 안 정해주면 브라우저가 알아서 한동안 캐싱해버려서 —
    # 새로 배포해도 이미 방문했던 학생들은 계속 옛 화면을 본다(개발 중 발견된 버그,
    # 시크릿 창은 되고 일반 창은 안 됐던 이유). no-cache는 캐시를 아예 금지하는 게
    # 아니라 "매번 서버에 물어봐서 안 바뀌었으면 그대로 쓰라"는 뜻이라 — 실제로 안
    # 바뀐 경우엔 304만 오가서 트래픽 낭비도 없다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
