# career-backend only — connects to a MariaDB you already run locally,
# not a bundled container. Fill in DB_* below (or override via `.env` /
# `docker compose --env-file`, same ${VAR:-default} syntax either way).
#
#   docker compose up --build
#
# DB_HOST defaults to `host.docker.internal`, which Docker Desktop resolves
# to the host machine automatically (Windows/Mac). `extra_hosts` below makes
# the same hostname work on native Linux Docker too.
#
# Your local MariaDB needs to actually accept connections from the container,
# not just 127.0.0.1 — two things to check if the backend can't connect:
#   1. MariaDB's bind-address isn't restricted to 127.0.0.1 (my.cnf / mariadb.conf.d)
#   2. The DB_USER's grant allows a non-localhost host, e.g.:
#        CREATE USER 'career_app'@'%' IDENTIFIED BY 'career_app';
#        GRANT ALL ON career_db.* TO 'career_app'@'%';
#      ('%' is broad — fine for local dev; scope it down for anything shared/prod)
services:
  backend:
    build: ./career-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-career_db}
      DB_USER: ${DB_USER:-career_app}
      DB_PASSWORD: ${DB_PASSWORD:-career_app}
      # frontend가 nginx에서 /api를 이 컨테이너로 프록시하므로(같은 origin) 브라우저
      # 입장에서 CORS는 사실상 안 씀 — 그래도 직접 호출 대비 실제 접속 도메인은 넣어둔다.
      CAREER_MATE_ALLOWED_ORIGINS: ${CAREER_MATE_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-deploying-this-anywhere-real-0000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # 정적 SPA + nginx — /api/**는 위 backend 컨테이너로 내부 프록시(nginx.conf 참고).
  # 브라우저는 이 컨테이너의 origin 하나만 본다.
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
